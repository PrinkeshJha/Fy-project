<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 350px;
            min-height: 200px;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1f3a 0%, #0a0e27 100%);
            color: #e0e6ed;
        }
        
        .header {
            background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 100%);
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: white;
        }
        
        .subtitle {
            margin: 5px 0 0 0;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .content {
            padding: 20px;
        }
        
        .status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            background: rgba(26, 31, 58, 0.6);
            border: 1px solid rgba(123, 47, 247, 0.3);
        }
        
        .status-text {
            font-size: 14px;
            font-weight: 600;
        }
        
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .safe {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.5);
        }
        
        .scanning {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.5);
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 100%);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.4);
        }
        
        .info {
            margin-top: 15px;
            padding: 12px;
            background: rgba(15, 20, 41, 0.6);
            border-radius: 6px;
            font-size: 12px;
            color: #8b95a5;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
        }
        
        .info-label {
            color: #a0aec0;
        }
        
        .info-value {
            color: #00d4ff;
            font-weight: 600;
        }
        
        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #00d4ff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛡️ AI Phishing Detector</h1>
        <p class="subtitle">Real-time protection powered by AI</p>
    </div>
    
    <div class="content">
        <div class="status">
            <span class="status-text">Current Page Status</span>
            <span class="status-badge safe" id="statusBadge">✓ Safe</span>
        </div>
        
        <button id="scanBtn">🔍 Scan This Page</button>
        
        <div class="info">
            <div class="info-item">
                <span class="info-label">URL Analysis:</span>
                <span class="info-value" id="urlScore">Pending</span>
            </div>
            <div class="info-item">
                <span class="info-label">Visual Check:</span>
                <span class="info-value" id="visualScore">Pending</span>
            </div>
            <div class="info-item">
                <span class="info-label">Confidence:</span>
                <span class="info-value" id="confidence">--</span>
            </div>
        </div>
    </div>
    
    <script src="pop.js"></script>
</body>
</html>
